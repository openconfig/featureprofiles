syntax = "proto3";

package openconfig.qualificationreporter;

option go_package = "github.com/openconfig/featureprofiles/proto/release_intent_go_proto;release_intent_go_proto";

// PlatformType defines the target execution environment for qualification.
enum PlatformType {
  PLATFORM_TYPE_UNSPECIFIED = 0;
  // Execution on physical hardware testbeds.
  PLATFORM_TYPE_HARDWARE = 1;
  // Execution in Kubernetes Network Emulation (KNE) virtual environment.
  PLATFORM_TYPE_KNE = 2;
}

// ReleaseIntent defines the set of feature profile tests required for
// qualifying a target release.
message ReleaseIntent {
  // Canonical identifier for the release (e.g., "August_2026_GA").
  string release_id = 1;

  // List of intended feature profile test IDs required to pass qualification
  // (e.g., "ACL-1.2", "gNOI-4.1").
  repeated string intended_test_ids = 2;

  // Target chassis Model Part Numbers (e.g., "DCS-7280CR3K-32D4",
  // "3HE14838AA"). Multiple MPNs may be specified for abstract SKUs with
  // multiple hardware variants.
  repeated string chassis_mpns = 3;

  // Target execution platform (e.g., HARDWARE or KNE virtual environment).
  PlatformType target_platform = 4;
}
